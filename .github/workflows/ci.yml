name: Nixconf CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git:
    name: "Git: branch + commits"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Lix: install"
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15

      - name: "Git: branch name"
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: nix run --builders '' .#check-branch-name -- "$BRANCH_NAME"

      - name: "Git: linear conventional history + secrets"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
            if [[ "$base" == "$HEAD_SHA" ]]; then
              base="$(git rev-parse "$HEAD_SHA^")"
            fi
            range="$base..$HEAD_SHA"
          fi

          if [[ -n "$(git rev-list --merges "$range")" ]]; then
            printf 'Merge commits are not allowed in %s.\n' "$range" >&2
            exit 1
          fi

          nix run --builders '' .#commitizen -- check \
            --allowed-prefixes \
            --rev-range "$range"
          nix run --builders '' .#gitleaks -- git \
            --log-opts="$range" \
            --redact=100 \
            --no-banner \
            --no-color

  quality:
    name: "Quality: format + lint + evaluation"
    needs: git
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Lix: install"
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15

      - name: "Cachix: configure read access"
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: anshulnoori

      - name: "Quality: evaluate all systems"
        run: nix flake check --all-systems --no-build -L

      - name: "Quality: check branch"
        if: github.ref != 'refs/heads/master'
        run: nix flake check -L

      - name: "Quality: check master and publish"
        if: github.ref == 'refs/heads/master'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            printf 'CACHIX_AUTH_TOKEN is required.\n' >&2
            exit 1
          fi

          cachix watch-exec anshulnoori -- nix flake check -L
